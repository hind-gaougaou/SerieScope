    <header class="bg-black border-b border-[#1f1f1f]">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center gap-3">
            <!-- <div class="w-9 h-9 rounded-lg bg-white text-black flex items-center justify-center font-bold"><img src="c:\Users\Youcode\Downloads\Vector.png" alt="icon"></div> -->

        </div>
    </header>
    <main class="bg-[#080808] ">
        <section class="max-w-6xl mx-auto px-6 py-6">
            <h1 class="text-3xl text-white font-bold">
                Explore les séries TV
            </h1>
            <p class="text-sm text-neutral-400 mt-1">
                Retrouve tes séries préférées et enrichis le catalogue.
            </p>
             <p id="message" class="text-red-500 text-xl my-2"></p>
            <form id="formulaire-serie" class="bg-[#191919] border border-[#303030] rounded-xl p-3 mt-4 m-3">
                <h3 class="text-xl text-white font-bold">
                    Ajouter une série
                </h3>

                <p class="text-sm text-neutral-400 mt-1 mb-4">
                    Les champs marqués d’un * sont obligatoires.
                </p>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                    <div class="flex flex-col gap-2">
                        <label class="text-sm text-white" for="nom">
                            Nom de la série *
                        </label>
                        <input id="nom" type="text" placeholder="Ex. The Bear" required
                            class="  rounded-lg border border-neutral-800 bg-[#1a1a1a] px-3 py-2 text-sm text-white outline-none">
                    </div>
                    <div class="flex flex-col gap-2">
                    <label for="language" class="block text-white text-sm font-medium mb-2">
                        Langue de la série
                    </label>
                    <input type="text" id="language" placeholder="Ex: Français, Anglais..."
                        class="w-full bg-[#191919] border border-[#303030] rounded-lg px-4 py-2 text-white outline-none focus:border-white" /> </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-sm text-white" for="genre">
                            Genre(s) *
                            <span class="text-neutral-500 text-xs">
                                — séparés par des virgules
                            </span>
                        </label>

                        <input id="genre" type="text" placeholder="Ex. Drame, Comédie" required
                            class="rounded-lg border border-neutral-800 bg-[#1a1a1a] px-3 py-2 text-sm text-white outline-none">
                    </div>

                    <div class="flex flex-col gap-2 md:col-span-2">
                        <label class="text-sm text-white" for="description">
                            Description
                            <span class="text-neutral-500 text-xs">facultative</span>
                        </label>

                        <textarea id="description" placeholder="Résume la série en quelques mots..." rows="3"
                            class="rounded-lg border border-neutral-800 bg-[#1a1a1a] px-3 py-2 text-sm text-white outline-none "></textarea>
                    </div>

                </div>

                <button type="submit" class="bg-white text-black text-sm font-semibold px-4 py-2 rounded-lg mt-2">
                    ＋ Ajouter la série
                </button>
